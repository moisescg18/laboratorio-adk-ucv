[project]
name = "laboratorio-adk-ucv"
version = "0.1.0"
description = "Mono-agente con Google ADK"
authors = [
    {name = "moisescg18",email = "mcamonesgo@ucvvirtual.edu.pe"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "google-adk (>=2.13.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]